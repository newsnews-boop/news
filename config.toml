# ---------------------------------------------------------------------
#  ランキング（トピックスとニュース一覧の間に表示）
#  ・type = "apple"   : Apple のランキング（登録不要）
#  ・type = "rakuten" : 楽天ブックスのジャンル別売上順。楽天ウェブサービスの アプリID と アクセスキー を
#                       GitHub の Secrets に RAKUTEN_APP_ID / RAKUTEN_ACCESS_KEY として登録すると表示されます
#    referer : 楽天のアプリ設定に登録した「WebサイトURL」と同じもの
#  ・show   : 最初に表示する件数（残りは「〜位を見る」で開く）
#  ・groups : ジャンルごとのランキング（genre は楽天ブックスのジャンルID、link は「楽天で見る」の行き先）
#  ・links  : 箱の下に並べる外部ランキングへのリンク
# ---------------------------------------------------------------------
[[rankings]]
id = "music"
name = "音楽"
source = "Apple Music"
type = "apple"
url = "https://rss.marketingtools.apple.com/api/v2/jp/music/most-played/10/songs.json"
show = 5

[[rankings]]
id = "books"
name = "本"
source = "楽天ブックス"
type = "rakuten"
