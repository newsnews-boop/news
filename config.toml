# =====================================================================
#  ニュースまとめページの設定ファイル
#  ・「#」から行末まではメモ（コメント）です。動作には影響しません。
#  ・ここに書いた内容は GitHub 上で公開されます。
#    人に見られたくない NG ワードは、ページ右上の「設定」から登録してください
#    （その端末のブラウザ内にだけ保存されます）。
# =====================================================================

[settings]
max_age_hours = 36          # これより古い記事は表示しない（時間）
max_items_per_section = 30  # 1ジャンルあたり最大何件まで保存するか
show_per_section = 8        # トピックスの各タブに表示する件数（残りは「もっと見る」）
hot_count = 8               # 「主要」タブに全ジャンルから選ぶ話題の件数
similarity = 0.55           # 重複記事とみなす見出しの類似度（0〜1、大きいほど厳しい）
paywall_penalty = 8         # 有料記事しかない話題の順位を下げる量（8 = 8時間古い記事、または報道2社分少ない扱い）

# ---------------------------------------------------------------------
#  フィルタ（全端末共通）
#  ng_sources : 表示しない媒体名（部分一致）。「.」を含むとドメインとして扱います
#  ng_words   : 見出しにこの語を含む記事は表示しない（部分一致）
#               「re:」で始めると正規表現として扱います
# ---------------------------------------------------------------------
[filter]
ng_sources = [
  # コタツ記事・タブロイド・ゴシップ系
  "J-CASTニュース", "j-cast.com",
  "まいどなニュース", "ENCOUNT", "Sirabee", "ねとらぼ",
  "日刊ゲンダイ", "東スポ", "夕刊フジ", "zakzak",
  "女性自身", "週刊女性", "女性セブン", "NEWSポストセブン",
  "SmartFLASH", "FRIDAY", "日刊SPA", "アサ芸",
  "デイリー新潮", "文春オンライン", "ABEMA TIMES",
  "dメニューニュース", "zakⅡ",
  # Googleニュース経由の Yahoo!ニュース配信記事（生活系・コタツ系が多いため）。
  # Yahoo! 編集部が選んだ記事は「Yahoo!トピックス」から別途取得しています。
  "Yahoo!ニュース",
  # Googleニュースの検索に混ざる、株価・銘柄情報のページ（ニュース記事ではない）
  "Yahoo!ファイナンス", "Yahoo! JAPAN",
]

# 有料記事が多い媒体（部分一致）。同じ話題を無料で読める媒体も報じていれば、そちらへリンクする。
# 他に報じた媒体がなければ、そのまま「有料」の印を付けて表示する。
# ※ 記事ページに「無料／有料」の印がある媒体（NHK・読売など）は、この一覧より記事ごとの印を優先
paywall_sources = [
  "朝日新聞", "毎日新聞", "日本経済新聞", "日経",
  "東洋経済", "ダイヤモンド・オンライン", "Bloomberg", "ウォール・ストリート・ジャーナル",
  "北海道新聞", "中日新聞", "東京新聞", "京都新聞", "神戸新聞", "西日本新聞",
]

ng_words = [
  # 煽り型の見出し表現
  "衝撃", "激怒", "炎上", "物議", "波紋", "騒然", "ざわつく", "ざわつき",
  "まさかの", "絶句", "唖然", "批判殺到", "猛批判", "痛烈", "苦言", "ブチギレ",
  "号泣", "悲痛", "赤裸々", "激白", "暴露", "意味深", "匂わせ", "ヤバい",
  "ネットの声", "ネット民", "SNSで話題", "なぜ？", "とは？", "の正体",
  "re:[!！]{2,}",            # 「!!」の連続
  "re:【(困惑|悲報|朗報|驚愕|衝撃|閲覧注意)】",
  # 芸能ゴシップ・スキャンダル
  "不倫", "熱愛", "交際報道", "破局", "密会", "略奪愛", "略奪婚", "二股", "スキャンダル",
  "離婚危機", "電撃婚", "文春砲",
  # 事件・事故の残酷な詳細
  "惨殺", "めった刺し", "バラバラ", "切断", "遺体損壊", "虐待死",
  "性的暴行", "わいせつ", "猟奇", "首を絞め", "遺棄", "血だらけ", "血まみれ",
  # ニュースではないページ
  "株価・株式情報",
]

# ---------------------------------------------------------------------
#  お金・投資のニュース（トピックスの「主要」の隣の「お金」タブに表示）
#  「お金」ジャンル（下の sections の id = "money"）の記事に加えて、
#  見出しにこの語を含む話題を全ジャンルから集める（部分一致。「re:」で始めると正規表現）
# ---------------------------------------------------------------------
[money]
count = 30   # 集める件数（最初は8本表示し、残りは「もっと見る」）
words = [
  # 金融政策・金利
  "日銀", "日本銀行", "FRB", "ECB", "利上げ", "利下げ", "金利", "国債", "金融政策", "植田総裁",
  # 為替・市場
  "為替", "円安", "円高", "ドル円", "株価", "株式", "株安", "株高", "日経平均", "TOPIX",
  "ダウ", "ナスダック", "S&P", "東証", "相場",
  # 企業
  "決算", "業績", "上方修正", "下方修正", "最高益", "赤字", "黒字", "上場", "IPO", "企業買収", "買収提案", "M&A", "TOB", "配当",
  # 景気・物価
  "物価", "インフレ", "デフレ", "CPI", "GDP", "景気", "賃上げ", "最低賃金", "値上げ", "値下げ",
  # 暮らしのお金
  "NISA", "iDeCo", "年金", "増税", "減税", "消費税", "所得税", "給付", "補助金", "住宅ローン",
  # 商品・資産
  "原油", "金価格", "暗号資産", "ビットコイン", "投資",
]

# ---------------------------------------------------------------------
#  ジャンルと取得元フィード
#  ・ジャンルの並び順がそのままページの並び順になります。
#  ・同じ出来事が複数ジャンルに出る場合は、上にあるジャンルに表示されます。
#  ・source       : 媒体名（Googleニュースは記事ごとの媒体名が自動で入ります）
#  ・priority     : 重複記事をまとめたとき、どの媒体の見出しを代表にするか（小さいほど優先）
#  ・boost        : 並び順の加点。編集部が選んだ「トピックス」等を上位に出すため（既定 0）
#  ・short_title  : true にすると、同じ話題ではこの媒体の短い見出しを一覧に使う
#  ・max_age_hours: このフィードだけ表示期間を変える（時間）
#  ・always_show  : true にすると、件数の上限に関係なく必ず載せる（件数の少ない情報源向け）
#  ・only_sources : 指定すると、その媒体の記事だけを採用（Googleニュースのピックアップ用）
# ---------------------------------------------------------------------
[[sections]]
id = "top"
name = "主要"
  [[sections.feeds]]
  source = "NHK"
  url = "https://news.web.nhk/n-data/conf/na/rss/cat0.xml"
  priority = 1
  boost = 2
  [[sections.feeds]]
  source = "Yahoo!トピックス"
  url = "https://news.yahoo.co.jp/rss/topics/top-picks.xml"
  priority = 8
  boost = 3
  short_title = true
  [[sections.feeds]]
  source = "Googleニュース"
  url = "https://news.google.com/rss?hl=ja&gl=JP&ceid=JP:ja"
  priority = 5

